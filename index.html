<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo - Bus Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🚌 BusGo</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#search">Book Ticket</a>
        <a href="#about">About</a>
    </nav>
</header>

<section id="home" class="hero">
    <div class="hero-content">
        <h1>Book Your Bus Ticket</h1>
        <p>Fast, simple and convenient bus ticket booking.</p>
        <a href="#search" class="btn">Book Now</a>
    </div>
</section>

<section id="search" class="booking-section">
    <h2>Search Buses</h2>

    <form id="bookingForm">
        <div class="form-group">
            <label for="from">From</label>
            <input type="text" id="from" placeholder="e.g. Hyderabad" required>
        </div>

        <div class="form-group">
            <label for="to">To</label>
            <input type="text" id="to" placeholder="e.g. Bangalore" required>
        </div>

        <div class="form-group">
            <label for="date">Travel Date</label>
            <input type="date" id="date" required>
        </div>

        <button type="submit" class="btn">Search Buses</button>
    </form>

    <div id="results"></div>
</section>

<section id="about" class="about">
    <h2>About BusGo</h2>
    <p>
        BusGo is a simple static bus ticket booking application.
        Search for buses, select your preferred bus and book your ticket.
    </p>
</section>

<footer>
    <p>© 2026 BusGo. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
